name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      # npm test rebuilds dist/, so any tracked diff or untracked file under dist/ means the committed dist/ is stale.
      # tsc never deletes output for a removed source, so every dist file must still have its src/*.ts.
      - name: Fail if committed dist/ is stale
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
          for f in dist/*.js dist/*.d.ts; do
            base="${f#dist/}"
            base="${base%.d.ts}"
            base="${base%.js}"
            test -f "src/$base.ts" || { echo "$f has no matching src/$base.ts"; exit 1; }
          done
