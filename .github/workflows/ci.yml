name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      # npm test rebuilds dist/, so any diff means the committed dist/ is stale.
      - name: Fail if committed dist/ is stale
        run: git diff --exit-code -- dist
